<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input,
        button {
            padding: 8px;
            margin: 5px 0;
        }

        .result {
            font-weight: bold;
            color: darkblue;
        }
    </style>
</head>

<body>
    <section>
        <h2>BMI Calculator</h2>
        <input type="number" id="weight" placeholder="Weight (kg)">
        <input type="number" id="height" placeholder="Height (m)">
        <button onclick="calculateBMI()">Calculate BMI</button>
        <p class="result" id="bmiResult"></p>
    </section>
    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            if (weight > 0 && height > 0) {
                let bmi = (weight / (height * height)).toFixed(2);
                document.getElementById("bmiResult").textContent = "Your BMI: " + bmi;
            } else {
                document.getElementById("bmiResult").textContent = "Please enter valid values.";
            }
        }</script>
</body>

</html>
